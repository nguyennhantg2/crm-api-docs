  Ticket:
    title: Ticket
    type: object
    description: |
      A ticket represents a task, issue, or work item associated with a workspace.
      Tickets are used to track work progress, assignments, and priorities across the team.
    properties:
      id:
        description: Unique identifier (UUID) of the ticket.
        format: uuid
        type: string
        example: "b20d47ba-cc24-421c-92f6-f59da03b0ce4"
      display_id:
        description: Human-readable sequential ID of the ticket within the workspace.
        type: integer
        example: 1
      ticket_id:
        description: Custom ticket identifier (zero-padded sequential code).
        type: string
        nullable: true
        example: "00001"
      title:
        description: Title or short summary of the ticket.
        type: string
        example: "Unable to update member information"
      description:
        description: Detailed description of the ticket.
        type: string
        nullable: true
      note:
        description: Additional notes or comments about the ticket.
        type: string
        nullable: true
      category:
        description: Category classification of the ticket.
        type: string
        nullable: true
        example: "order"
      status:
        description: Current status of the ticket.
        type: string
        default: "new"
        example: "in_progress"
        enum:
          - new
          - in_progress
          - completed
      priority:
        description: Priority level of the ticket.
        type: string
        nullable: true
        example: "medium"
        enum:
          - low
          - medium
          - high
      due_date:
        description: The date and time when the ticket is due.
        type: string
        format: date-time
        nullable: true
        example: "2026-02-07T09:37:25"
      completed_at:
        description: The date and time when the ticket was completed.
        type: string
        format: date-time
        nullable: true
      assignee_ids:
        description: |
          User ID assigned to this ticket. Required.
        type: array
        minItems: 1
        maxItems: 1
        items:
          type: string
          format: uuid
        example:
          - "4db4c09e-5fb6-47e7-a4d9-3ad49110155d"
      related_owner:
        description: |
          User IDs of everyone else related to this ticket.
        type: array
        nullable: true
        items:
          type: string
          format: uuid
        example:
          - "d1e93867-cc3c-4efe-8280-7b34ab80ba12"
          - "0ff972fd-19a6-487e-b7ce-2398cdc8b875"
      creator_id:
        description: ID of the user who created the ticket.
        type: string
        format: uuid
        example: "0ff972fd-19a6-487e-b7ce-2398cdc8b875"
      extra_info:
        description: Dynamic custom fields defined by users.
        type: object
        additionalProperties: true
        nullable: true
        example:
          is_sample_data: true
      kanban_order:
        description: Ordering key used to sort tickets on a kanban board.
        type: string
        nullable: true
        example: "62"
      source:
        type: array
        items:
          type: integer
          $ref: '#/definitions/Source/properties/id'
        description: |
          Array of integer IDs referencing the sources this lead came from.
          [Source schema](#/schemas/Source)
        example: ["-11"]
      record_relations:
        description: |
          List of related record associations for this ticket
          (e.g. linked tasks, orders, deals, records or other tickets).
        type: array
        items:
          type: object
      contact_id:
        description: |
          ID of the contact this ticket is linked to. Required.
          The value is the `id` of a [record](#/schemas/Record) in the `contact` table.
        type: string
        format: uuid
        example: "0c1649c6-2297-4835-9a68-8fdd1d348d8b"
      is_removed:
        description: Whether the ticket has been soft-deleted.
        type: boolean
        default: false
        example: false
      inserted_at:
        description: The date and time when the ticket was created.
        type: string
        format: date-time
        example: "2026-02-04T10:14:32.683430"
      updated_at:
        description: The date and time when the ticket was last updated.
        type: string
        format: date-time
        example: "2026-02-04T10:14:32.683430"
    required:
      - title
      - contact_id
      - assignee_ids

  Order:
    title: Order
    type: object
    description: |
      A sales order belonging to a workspace. An order groups line items (`items`), payment
      information, and links to related records (contact, account, deal, calendar) through
      `record_relations`. Monetary amounts are integers in the workspace currency's smallest
      practical unit (for VND this is the dong, with no decimals).
    properties:
      id:
        description: Unique identifier (UUID) of the order.
        format: uuid
        type: string
        example: "b20d47ba-cc24-421c-92f6-f59da03b0ce4"
      workspace_id:
        description: ID of the workspace the order belongs to.
        type: integer
        example: 2
      display_id:
        description: Human-readable sequential ID of the order within the workspace (rendered as `OD{display_id}`).
        type: integer
        example: 12
      custom_id:
        description: Custom order code/identifier.
        type: string
        nullable: true
        example: "OD00012"
      status:
        description: Current status of the order.
        type: string
        default: "new"
        example: "new"
      bill_phone_number:
        description: Billing phone number (defaults to the linked contact's phone number).
        type: string
        nullable: true
        example: "0972273341"
      bill_full_name:
        description: Billing full name.
        type: string
        nullable: true
      bill_email:
        description: Billing email (defaults to the linked contact's email).
        type: string
        nullable: true
      note:
        description: Free-text note on the order.
        type: string
        nullable: true
      note_image:
        description: List of image URLs attached to the note.
        type: array
        nullable: true
        items:
          type: string
      assigning_seller_id:
        description: ID of the user (seller) assigned to handle this order.
        type: string
        format: uuid
        nullable: true
        example: "4db4c09e-5fb6-47e7-a4d9-3ad49110155d"
      creator_id:
        description: ID of the user who created the order.
        type: string
        format: uuid
        nullable: true
      related_owner:
        description: List of additional user IDs related as owners of this order.
        type: array
        nullable: true
        items:
          type: string
          format: uuid
      total_quantity:
        description: Total quantity across all line items (computed server-side).
        type: integer
        example: 3
      discount:
        description: Order-level discount amount.
        type: integer
        example: 0
      total_discount:
        description: Sum of line-item discounts (computed server-side).
        type: integer
        example: 0
      transfer_money:
        description: Amount paid by bank transfer.
        type: integer
        example: 0
      surcharge:
        description: Additional surcharge added to the order total.
        type: integer
        example: 0
      cod:
        description: |
          Cash-on-delivery amount due, computed as
          `sum(item totals) + surcharge - discount - prepaid`.
        type: integer
        example: 150000
      prepaid:
        description: Total amount already paid (`deposit + cash + transfer_money`).
        type: integer
        example: 0
      deposit:
        description: Deposit amount paid up front.
        type: integer
        example: 0
      cash:
        description: |
          Cash portion of the prepaid amount (`prepaid - transfer_money - deposit`).
          Computed virtual field, present in responses only.
        type: integer
        example: 0
      source_ids:
        description: Array of source IDs the order is attributed to.
        type: array
        nullable: true
        items:
          type: string
        example: ["-11"]
      is_removed:
        description: Whether the order has been soft-deleted.
        type: boolean
        default: false
        example: false
      extra_infor:
        description: Dynamic custom fields. Also stores derived helpers such as `item_product_ids` and `item_prices`.
        type: object
        additionalProperties: true
        nullable: true
      items:
        description: Line items belonging to this order.
        type: array
        items:
          $ref: '#/definitions/OrderItem'
      record_relations:
        description: |
          Records linked to this order (e.g. the related `contact`, `account`, `deal`).
          Each relation embeds the resolved `record` object when available.
        type: array
        items:
          type: object
          properties:
            table_name:
              type: string
              example: "contact"
            type:
              type: string
              example: "order"
            record_id:
              type: string
            related_id:
              type: string
            record:
              type: object
              additionalProperties: true
              nullable: true
      rating:
        description: Latest rating associated with the order, if any.
        type: object
        nullable: true
      inserted_at:
        description: The date and time when the order was created.
        type: string
        format: date-time
        example: "2026-02-04T10:14:32.683430"
      updated_at:
        description: The date and time when the order was last updated.
        type: string
        format: date-time
        example: "2026-02-04T10:14:32.683430"

  OrderItem:
    title: Order Item
    type: object
    description: A single line item within an order.
    properties:
      id:
        description: Unique identifier (UUID) of the line item.
        type: string
        format: uuid
      order_id:
        description: ID of the order this item belongs to.
        type: string
        format: uuid
      product_id:
        description: ID of the product for this line item.
        type: string
        format: uuid
        nullable: true
      quantity:
        description: Quantity ordered.
        type: integer
        example: 2
      price:
        description: Unit price.
        type: integer
        example: 75000
      discount:
        description: Per-unit discount.
        type: integer
        example: 0
      total_discount:
        description: Total discount applied to this line (`subtotal - total_price`).
        type: integer
        example: 0
      total_price:
        description: Final total for this line after discount.
        type: integer
        example: 150000
      variation_info:
        description: Snapshot of the product/variation at the time of ordering.
        type: object
        nullable: true
        properties:
          name:
            type: string
            example: "Áo thun nam"
          retail_price:
            type: integer
          import_price:
            type: integer
          images:
            type: array
            items:
              type: string
          product_id:
            type: string
            format: uuid
          category_ids:
            type: array
            items:
              type: integer
          type:
            type: string
          start_time:
            type: string
            format: date-time
            nullable: true
          end_time:
            type: string
            format: date-time
            nullable: true
          duration:
            type: integer
            nullable: true
          service_info:
            type: object
            additionalProperties: true
            nullable: true
      workspace_id:
        type: integer
      inserted_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time

  Source:
    type: object
    description: |
      The source of the customer (lead source).
      This field is shared and consistent across the entire workspace.
      Common values include: Facebook, Google, TikTok, Whatsapp, Shopee, Zalo, etc.
    properties:
      id:
        description: >
          Unique identifier (Integer) of the customer source record.
        format: integer
        type: string
      name:
        type: string
        example: "Facebook"
      parent_id:
        type: integer
        nullable: true
        example: 50
      image:
        type: string
        nullable: true
        example: "https://crm.pancake.vn/v2/images/logo.svg"
      is_removed:
        type: boolean
        default: false
      custom_id:
        type: string
        nullable: true
      link:
        type: string
        nullable: true
    required:
      - name
    type: object

  PancakeTag:
    title: Pancake Tag
    type: object
    description: |
      A label/tag used to classify records within a workspace.
      Tags are shared across the workspace and typically used for segmentation,
      filtering, and note-keeping on customer records.
    properties:
      id:
        type: string
        description: Unique identifier of the pancake tag.
        example: "104943019063372_11"
      text:
        type: string
        description: Display label of the tag.
        example: "Quality Check"
      description:
        type: string
        nullable: true
        description: Optional note describing the tag's purpose.
        example: "Tag used to classify orders requiring quality check before shipping"
      color:
        type: string
        description: Primary color of the tag in HEX format.
        example: "#138809"
      lighten_color:
        type: string
        description: Background/lightened color of the tag in RGBA format.
        example: "rgba(19,136,9,0.4)"
    required:
      - id
      - text

  Product:
    title: Product
    type: object
    description: |
      A product, service, or service package sold by a workspace.

      The `type` field determines how the entry behaves:
      - `product` — a physical/inventory item; `remain_quantity` is tracked.
      - `service` — a bookable service; `duration` (in minutes) applies, `remain_quantity` is ignored.
      - `service_package` — a bundle of services; `service_package_product` lists the
        component services with their quantities. `remain_quantity` and `duration` are ignored.

      Monetary amounts are integers in the workspace currency's smallest practical unit
      (for VND this is the dong, with no decimals).
    required:
      - name
    properties:
      id:
        description: Unique identifier (UUID) of the product. Omit when creating; provide when updating.
        type: string
        format: uuid
        example: "3a5b1b0e-88bd-4d34-9a4b-2c4f4be21f38"
      name:
        description: Product name.
        type: string
        example: "Áo thun nam"
      type:
        description: Product type. Defaults to `product` on create.
        type: string
        enum:
          - product
          - service
          - service_package
        default: "product"
        example: "product"
      custom_id:
        description: Custom product code (unique per workspace).
        type: string
        nullable: true
        example: "SKU-001"
      description:
        description: Free-text description of the product.
        type: string
        nullable: true
      images:
        description: List of image URLs for the product.
        type: array
        nullable: true
        items:
          type: string
        example: ["https://static.pancake.vn/pancake/products/example.jpg"]
      category_ids:
        description: IDs of the categories this product belongs to.
        type: array
        nullable: true
        items:
          type: string
          format: uuid
      retail_price:
        description: Selling price per unit.
        type: integer
        default: 0
        example: 150000
      import_price:
        description: Cost/import price per unit.
        type: integer
        default: 0
        example: 90000
      remain_quantity:
        description: |
          Current stock on hand. Only meaningful for `type: product` —
          stripped server-side for `service` and `service_package`.
        type: integer
        default: 0
        example: 42
      duration:
        description: |
          Service duration in minutes. Only meaningful for `type: service` —
          stripped server-side for `product` and `service_package`.
        type: integer
        nullable: true
        example: 60
      is_removed:
        description: Whether the product has been soft-deleted.
        type: boolean
        default: false
      product_attributes:
        description: |
          Attribute definitions used to build variations (e.g. Color, Size).
          Each attribute declares a `name` and its allowed `values`.
        type: array
        items:
          $ref: '#/definitions/ProductAttribute'
      variations:
        description: |
          Product variations (e.g. Red / Size L). On write, this array fully replaces
          the current variations: existing rows whose `custom_id` is missing from the
          new list are deleted, matching rows are updated, and new ones are inserted.
        type: array
        items:
          $ref: '#/definitions/ProductVariation'
      service_package_product:
        description: |
          Only for `type: service_package` — the component services included in the package,
          each with the quantity used per package. On write, fully replaces the existing links.
        type: array
        items:
          $ref: '#/definitions/ServicePackageProductItem'

  ProductAttribute:
    title: Product Attribute
    type: object
    description: A named attribute (e.g. Color, Size) whose values combine to form variations.
    required:
      - name
    properties:
      name:
        description: Attribute display name.
        type: string
        example: "Color"
      values:
        description: Allowed values for this attribute.
        type: array
        items:
          type: string
        example: ["Red", "Blue", "Green"]
      keyword:
        description: Optional keyword metadata per value (used by search / recognition features).
        type: array
        items:
          type: object
          additionalProperties: true

  ProductVariation:
    title: Product Variation
    type: object
    description: |
      A specific SKU of a product (e.g. Red / Size L). Variations override the parent
      product's `custom_id`, `retail_price`, `import_price`, `remain_quantity` and `images`.
    required:
      - custom_id
    properties:
      id:
        description: Unique identifier (UUID) of the variation. Omit when creating.
        type: string
        format: uuid
      custom_id:
        description: Variation SKU / custom code. Required and used as the merge key on update.
        type: string
        example: "SKU-001-RED-L"
      retail_price:
        description: Selling price per unit for this variation.
        type: integer
        default: 0
        example: 160000
      import_price:
        description: Cost/import price per unit for this variation.
        type: integer
        default: 0
      remain_quantity:
        description: Current stock on hand for this variation.
        type: integer
        default: 0
      images:
        description: Image URLs specific to this variation (falls back to the parent product's images if empty).
        type: array
        items:
          type: string
      sort_variation_attributes:
        description: |
          Canonical string of the variation's attribute values used for sorting/matching
          (typically the attribute values joined in a defined order, e.g. `"Red|L"`).
        type: string
        nullable: true
      extra_info:
        description: |
          Free-form additional metadata for the variation.

          Known keys:
          - `fb_catalog_id` — ID of the corresponding product in the Meta (Facebook) catalog.
            Used to fire conversion events (Purchase, AddToCart, …) so they match the right
            catalog item for ad optimization / attribution.
        type: object
        additionalProperties: true
        example:
          fb_catalog_id: "1234567890"
      is_removed:
        description: Whether the variation has been soft-deleted.
        type: boolean
        default: false

  ServicePackageProductItem:
    title: Service Package Component
    type: object
    description: |
      A component service inside a service package. Sent as an item of
      `Product.service_package_product` when creating/updating a `type: service_package`
      product. The full `Product` shape may be included on read (with the extra
      `service_package_product_quantity` field showing how many units of that service
      are consumed per package).
    required:
      - id
    properties:
      id:
        description: ID of the service product to include in the package.
        type: string
        format: uuid
      service_package_product_quantity:
        description: Quantity of this service consumed per package (write) / included per package (read).
        type: integer
        example: 1
x-explorer-enabled: false