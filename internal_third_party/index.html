<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <script>
    (function () {
      var path = window.location.pathname.replace(/\/index\.html?$/i, '').replace(/\/+$/, '');
      var base = path.slice(0, path.lastIndexOf('/')) || '/';
      window.location.replace(base + '?doc=internal_third_party');
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=../?doc=internal_third_party">
</head>

<body></body>

</html>
